<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EDUTAX | Educational Tax Administration Simulation</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
<div id="app">

    <section class="login-page">
        <div class="login-card">

            <div class="login-left">
                <div class="brand-area">
                    <img src="assets/logo-uny.png" alt="Logo UNY">
                    <h1>Login</h1>
                    <p>TAHAP 1 — MODUL ROLE AKSES</p>
                </div>

                <form id="login-form">
                    <div class="input-group">
                        <label>ID Pengguna *</label>
                        <input type="text" id="username" placeholder="Masukkan ID Pengguna">
                    </div>

                    <div class="input-group">
                        <label>Kata Sandi *</label>
                        <div class="password-box">
                            <input type="password" id="password" placeholder="Masukkan Kata Sandi">
                            <button type="button">👁</button>
                        </div>
                    </div>

                    <button class="login-btn">
                        Login
                    </button>
                </form>
            </div>

            <div class="login-right">
                <div class="right-content">
                    <h1>EduTax</h1>
                    <h2>
                        Educational Tax<br>
                        Administration<br>
                        System
                    </h2>
                </div>
            </div>

        </div>
    </section>

</div>

<script src="script.js"></script>
</body>
</html>
